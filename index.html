<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f1f">
<title>Viral AI Lab</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; padding: 22px 16px 60px;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #e8eaf6; background: #0b0f1f;
    background-image:
      radial-gradient(600px 400px at 90% -5%, rgba(236,72,153,.28), transparent 60%),
      radial-gradient(600px 450px at -10% 10%, rgba(99,102,241,.32), transparent 60%);
    background-attachment: fixed;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .badge { display: inline-block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #f9a8d4; background: rgba(236,72,153,.12); border: 1px solid rgba(236,72,153,.3); padding: 5px 10px; border-radius: 99px; }
  h1 { font-size: 34px; line-height: 1.1; margin: 14px 0 6px; letter-spacing: -.02em; }
  h1 span { background: linear-gradient(90deg,#818cf8,#f472b6 60%,#fb923c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin: 0 0 22px; color: #9aa3c7; font-size: 15px; }

  .panel { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 20px; padding: 16px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  label.l { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: #8b94bb; margin: 14px 0 8px; }
  label.l:first-child { margin-top: 0; }
  textarea {
    width: 100%; padding: 14px; font-size: 16px; font-family: inherit; color: #fff; resize: none;
    background: rgba(8,11,25,.7); border: 1px solid rgba(255,255,255,.12); border-radius: 14px; outline: none;
  }
  textarea:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129,140,248,.25); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 14px; font-size: 14px; color: #c5cbe8; cursor: pointer; font-family: inherit;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 99px;
  }
  .chip.on { color: #fff; background: linear-gradient(90deg,#6366f1,#ec4899); border-color: transparent; font-weight: 600; }
  .ideas .chip { font-size: 13px; padding: 7px 12px; color: #a5b0e0; }

  .go {
    width: 100%; margin-top: 18px; padding: 16px; font-size: 17px; font-weight: 700; color: #fff; cursor: pointer; font-family: inherit;
    border: 0; border-radius: 14px; background: linear-gradient(90deg,#6366f1,#ec4899 70%,#fb923c);
    box-shadow: 0 10px 30px rgba(236,72,153,.28);
  }
  .go:active { transform: scale(.98); }
  .go:disabled { opacity: .65; }

  #results { margin-top: 22px; display: grid; gap: 14px; }
  .card { background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 16px; animation: up .45s ease both; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
  .card-h h3 { margin: 0; font-size: 17px; }
  .copy { padding: 7px 12px; font-size: 13px; color: #c7d2fe; background: transparent; border: 1px solid rgba(129,140,248,.5); border-radius: 99px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .body { font-size: 15.5px; line-height: 1.6; color: #dfe3f7; }
  .body p { margin: 8px 0; }
  .body ul, .body ol { padding-left: 20px; margin: 8px 0; }
  .body li { margin: 7px 0; }
  .body b { color: #f9a8d4; }
  .body i { color: #c7d2fe; }

  .regen { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; color: #c7d2fe; background: transparent; border: 1px solid rgba(129,140,248,.55); border-radius: 14px; cursor: pointer; font-family: inherit; }

  .skel { height: 120px; border-radius: 18px; background: linear-gradient(100deg, rgba(255,255,255,.05) 30%, rgba(255,255,255,.13) 50%, rgba(255,255,255,.05) 70%); background-size: 300% 100%; animation: sh 1.4s infinite; }
  @keyframes sh { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .err { color: #fca5a5; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.35); border-radius: 14px; padding: 14px; font-size: 15px; }

  #history { margin-top: 26px; }
  .hist-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .hist-h h2 { margin: 0; font-size: 16px; color: #c5cbe8; }
  .clear { background: none; border: 0; color: #8b94bb; font-size: 13px; cursor: pointer; font-family: inherit; text-decoration: underline; }
  .hist-item { width: 100%; text-align: left; margin-bottom: 8px; padding: 12px 14px; color: #e8eaf6; font-family: inherit; cursor: pointer; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; }
  .hist-item b { display: block; font-size: 15px; margin-bottom: 3px; }
  .hist-item span { font-size: 12.5px; color: #8b94bb; }
  .foot { text-align: center; color: #6b7499; font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">⚡ AI Studio</span>
  <h1>Viral <span>AI Lab</span></h1>
  <p class="sub">Hooks, scripts and captions for videos that spread.</p>

  <div class="panel">
    <label class="l">Video topic</label>
    <textarea id="promptInput" rows="3" placeholder="e.g. home leg workout"></textarea>
    <div class="chips ideas" id="ideas" style="margin-top:10px"></div>

    <label class="l">Platform</label>
    <div class="chips" id="platformChips"></div>

    <label class="l">Tone</label>
    <div class="chips" id="toneChips"></div>

    <label class="l">Video length</label>
    <div class="chips" id="lengthChips"></div>

    <button class="go" id="genBtn" onclick="generateScript()">✨ Generate</button>
  </div>

  <div id="results"></div>
  <div id="history"></div>
  <div class="foot">Viral AI Lab</div>
</div>

<script>
const PLATFORMS = ['TikTok', 'Instagram Reels', 'YouTube Shorts'];
const TONES = [
  ['energetic', '🔥 Energetic'], ['funny', '😂 Funny'], ['emotional', '💖 Emotional'],
  ['educational', '🎓 Educational'], ['luxury', '✨ Elegant']
];
const LENGTHS = [15, 30, 60];
const IDEAS = ['Leg workout', 'Morning routine', 'Healthy breakfast', 'Fall outfit ideas', 'Money saving tips'];
const HKEY = 'viral_ai_lab_history';

let platform = PLATFORMS[0], tone = TONES[0][0], len = 30, raws = [];

function chips(id, items, getVal, getLabel, onPick, isOn) {
  const box = document.getElementById(id);
  box.innerHTML = '';
  items.forEach(it => {
    const b = document.createElement('button');
    b.className = 'chip' + (isOn && isOn(it) ? ' on' : '');
    b.textContent = getLabel(it);
    b.onclick = () => { onPick(getVal(it)); if (isOn) drawChips(); };
    box.appendChild(b);
  });
}
function drawChips() {
  chips('platformChips', PLATFORMS, p => p, p => p, v => platform = v, p => p === platform);
  chips('toneChips', TONES, t => t[0], t => t[1], v => tone = v, t => t[0] === tone);
  chips('lengthChips', LENGTHS, l => l, l => l + ' sec', v => len = v, l => l === len);
}
drawChips();
chips('ideas', IDEAS, i => i, i => i, v => { document.getElementById('promptInput').value = v; });

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s) { return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>'); }

function render(md) {
  let out = '', list = '';
  const close = () => { if (list) { out += '</' + list + '>'; list = ''; } };
  for (const raw of md.split('\n')) {
    const e = esc(raw);
    const ul = e.match(/^\s*[*-]\s+(.*)$/), ol = e.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      const t = ul ? 'ul' : 'ol';
      if (list !== t) { close(); out += '<' + t + '>'; list = t; }
      out += '<li>' + inline((ul || ol)[1]) + '</li>';
      continue;
    }
    close();
    if (/^#{1,6}\s/.test(e)) out += '<p><b>' + inline(e.replace(/^#{1,6}\s/, '')) + '</b></p>';
    else if (/^-{3,}$/.test(e.trim())) continue;
    else if (e.trim()) out += '<p>' + inline(e) + '</p>';
  }
  close();
  return out;
}

function showResults(md) {
  const box = document.getElementById('results');
  box.innerHTML = '';
  raws = [];
  let parts = md.split(/^##\s+/m).map(s => s.trim()).filter(Boolean);
  if (parts.length === 0) parts = [md];
  parts.forEach((p, i) => {
    const nl = p.indexOf('\n');
    const hasHead = md.includes('## ') && nl > -1;
    const title = hasHead ? p.slice(0, nl).trim() : 'Result';
    const body = hasHead ? p.slice(nl + 1).trim() : p;
    raws.push(body);
    const c = document.createElement('div');
    c.className = 'card';
    c.style.animationDelay = (i * 90) + 'ms';
    c.innerHTML = '<div class="card-h"><h3>' + esc(title) + '</h3><button class="copy" data-i="' + i + '">📋 Copy</button></div><div class="body">' + render(body) + '</div>';
    box.appendChild(c);
  });
  box.querySelectorAll('.copy').forEach(b => b.onclick = () => {
    navigator.clipboard.writeText(raws[b.dataset.i]);
    b.textContent = '✅ Copied';
    setTimeout(() => b.textContent = '📋 Copy', 1400);
  });
  const r = document.createElement('button');
  r.className = 'regen';
  r.textContent = '🔄 Regenerate';
  r.onclick = generateScript;
  box.appendChild(r);
}

/* ---------- History (saved on this device) ---------- */
function getHist() {
  try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) { return []; }
}
function saveHist(entry) {
  try {
    const h = [entry, ...getHist()].slice(0, 10);
    localStorage.setItem(HKEY, JSON.stringify(h));
  } catch (e) {}
  renderHist();
}
function clearHist() {
  try { localStorage.removeItem(HKEY); } catch (e) {}
  renderHist();
}
function renderHist() {
  const box = document.getElementById('history');
  const h = getHist();
  box.innerHTML = '';
  if (!h.length) return;
  const head = document.createElement('div');
  head.className = 'hist-h';
  head.innerHTML = '<h2>🕘 Recent</h2>';
  const clr = document.createElement('button');
  clr.className = 'clear';
  clr.textContent = 'Clear all';
  clr.onclick = clearHist;
  head.appendChild(clr);
  box.appendChild(head);
  h.forEach(item => {
    const b = document.createElement('button');
    b.className = 'hist-item';
    const t = document.createElement('b');
    t.textContent = item.topic;
    const m = document.createElement('span');
    m.textContent = item.platform + ' · ' + item.len + ' sec · ' + new Date(item.ts).toLocaleDateString();
    b.appendChild(t); b.appendChild(m);
    b.onclick = () => {
      document.getElementById('promptInput').value = item.topic;
      platform = item.platform; tone = item.tone; len = item.len;
      drawChips();
      showResults(item.out);
      document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
    };
    box.appendChild(b);
  });
}
renderHist();

async function generateScript() {
  const text = document.getElementById('promptInput').value;
  const btn = document.getElementById('genBtn');
  const box = document.getElementById('results');
  if (!text.trim()) { document.getElementById('promptInput').focus(); return; }

  btn.disabled = true; btn.textContent = 'Generating...';
  box.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  box.scrollIntoView({ behavior: 'smooth' });
  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: text, platform, tone, length: len })
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.error || 'Request failed');
    }
    const full = await res.text();
    if (!full.trim()) throw new Error('No response from the AI model.');
    showResults(full);
    saveHist({ topic: text.trim(), platform, tone, len, out: full, ts: Date.now() });
  } catch (err) {
    box.innerHTML = '<div class="err">' + esc(err.message) + '</div>';
  }
  btn.disabled = false; btn.textContent = '✨ Generate';
}
</script>
</body>
</html>
