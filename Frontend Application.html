<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIRAL AI LAB</title>
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; }
        
        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: bold; color: var(--accent-color); letter-spacing: 1px; }
        
        nav { display: flex; gap: 10px; }
        .nav-btn { background: transparent; border: none; color: var(--text-muted); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .nav-btn.active, .nav-btn:hover { background: var(--border-color); color: var(--text-color); }

        main { flex: 1; padding: 20px; max-width: 800px; width: 100%; margin: 0 auto; }
        .view { display: none; }
        .view.active { display: block; }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        h2 { margin-bottom: 15px; font-size: 22px; }
        p { color: var(--text-muted); margin-bottom: 15px; font-size: 14px; }

        label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-muted); }
        input, select, textarea { width: 100%; padding: 10px 14px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color); margin-bottom: 15px; font-size: 14px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-color); }

        .btn { background: var(--accent-color); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; width: 100%; transition: background 0.2s; }
        .btn:hover { background: var(--accent-hover); }

        .result-box { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-top: 15px; white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
        
        .pricing-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 600px) { .pricing-grid { grid-template-columns: 1fr 1fr; } }
        .price-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .price-card.featured { border-color: var(--accent-color); }
        .price { font-size: 28px; font-weight: bold; margin: 15px 0; color: var(--text-color); }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ VIRAL AI LAB</div>
        <nav>
            <button class="nav-btn active" onclick="switchView('generator', this)">Generator</button>
            <button class="nav-btn" onclick="switchView('pricing', this)">Pricing</button>
            <button class="nav-btn" onclick="switchView('settings', this)">Settings</button>
        </nav>
    </header>

    <main>
        <div id="generator" class="view active">
            <div class="card">
                <h2>AI Content Generator</h2>
                <p>Create viral short-form hooks and scripts instantly.</p>
                
                <label>Platform</label>
                <select id="platform">
                    <option value="TikTok">TikTok</option>
                    <option value="Instagram Reels">Instagram Reels</option>
                    <option value="YouTube Shorts">YouTube Shorts</option>
                </select>

                <label>Niche / Topic</label>
                <input type="text" id="niche" placeholder="e.g. Fitness, AI Tools, Personal Finance">

                <label>Prompt / Instructions</label>
                <textarea id="promptText" rows="3" placeholder="What should the script be about?"></textarea>

                <button class="btn" onclick="generateContent()">Generate Script</button>

                <div id="resultContainer" style="display: none;">
                    <div class="result-box" id="outputResult"></div>
                </div>
            </div>
        </div>

        <div id="pricing" class="view">
            <div class="pricing-grid">
                <div class="price-card">
                    <div>
                        <h3>Starter</h3>
                        <p>For casual creators</p>
                        <div class="price">Free</div>
                    </div>
                    <button class="btn" style="background: var(--border-color);" disabled>Current Plan</button>
                </div>
                <div class="price-card featured">
                    <div>
                        <h3>Pro Creator</h3>
                        <p>Unlimited AI generation & advanced tools</p>
                        <div class="price">$9.99<span style="font-size:14px; color:var(--text-muted)">/mo</span></div>
                    </div>
                    <button class="btn" onclick="startLiveCheckout('pri_tvoj_live_price_id')">Upgrade to Pro</button>
                </div>
            </div>
        </div>

        <div id="settings" class="view">
            <div class="card">
                <h2>Account Settings</h2>
                <p>Manage your account subscription and preferences.</p>
                <label>Registered Email</label>
                <input type="email" value="user@example.com" readonly>
                <button class="btn" onclick="alert('Settings saved successfully!')">Save Changes</button>
            </div>
        </div>
    </main>

    <script>
        Paddle.Initialize({ 
            token: 'live_tvoj_stvarni_live_token' 
        });

        function switchView(viewId, btnElement) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            btnElement.classList.add('active');
        }

        async function generateContent() {
            const platform = document.getElementById('platform').value;
            const niche = document.getElementById('niche').value;
            const prompt = document.getElementById('promptText').value;
            const outputBox = document.getElementById('outputResult');
            const resultContainer = document.getElementById('resultContainer');

            if (!prompt) {
                alert('Please enter a prompt or topic.');
                return;
            }

            outputBox.innerText = 'Generating content with AI...';
            resultContainer.style.display = 'block';

            try {
                const response = await fetch('/api/generate-content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ platform, niche, prompt })
                });
                const data = await response.json();
                if (data.success) {
                    outputBox.innerText = data.result;
                } else {
                    outputBox.innerText = 'Error: ' + (data.message || 'Failed to generate.');
                }
            } catch (error) {
                outputBox.innerText = 'Network error: ' + error.message;
            }
        }

        function startLiveCheckout(priceId) {
            Paddle.Checkout.open({
                items: [{ priceId: priceId, quantity: 1 }],
                settings: { successUrl: window.location.origin + '/?success=true' }
            });
        }
    </script>
</body>
</html>
