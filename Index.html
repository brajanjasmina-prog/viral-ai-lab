<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral AI Lab</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: #1e293b; padding: 20px; border-radius: 10px; }
        textarea { width: 100%; padding: 10px; margin-top: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; margin-top: 15px; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        #outputDiv { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 5px; white-space: pre-wrap; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Viral AI Lab</h2>
        <!-- Koristimo standardni placeholder koji služi samo kao natpis dok je polje prazno -->
        <textarea id="promptInput" rows="4" placeholder="Unesi temu ovde..."></textarea>
        <button onclick="generateScript()">Generiši</button>
        <div id="outputDiv">Rezultat će se pojaviti ovde...</div>
    </div>
    <script>
        async function generateScript() {
            const promptText = document.getElementById('promptInput').value;
            const outputDiv = document.getElementById('outputDiv');
            if (!promptText.trim()) { outputDiv.innerText = "Unesi prompt!"; return; }
            outputDiv.innerText = "Generisanje...";
            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });
                const data = await res.json();
                outputDiv.innerText = data.output || data.error;
            } catch (err) {
                outputDiv.innerText = "Greška: " + err.message;
            }
        }
    </script>
</body>
</html>
