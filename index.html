<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral AI Lab - AI Content Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        textarea, input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #4f46e5; }
        #outputDiv {
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            border: 1px solid #334155;
            min-height: 50px;
        }
        .error { color: #f87171; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Content Generator</h2>
        <p>Create viral short-form hooks and scripts instantly.</p>

        <label for="promptInput">Prompt / Instructions</label>
        <textarea id="promptInput" rows="4" placeholder="Unesi temu ili opis (npr. Exercise for legs)..."></textarea>

        <button onclick="generateScript()">Generate Script</button>

        <div id="errorDiv" class="error"></div>
        <div id="outputDiv">Ovde će se pojaviti generisani tekst...</div>
    </div>

    <script>
        async function generateScript() {
            const promptText = document.getElementById('promptInput').value;
            const errorDiv = document.getElementById('errorDiv');
            const outputDiv = document.getElementById('outputDiv');

            errorDiv.innerText = "";
            if (!promptText.trim()) {
                errorDiv.innerText = "Molimo unesite prompt!";
                return;
            }

            outputDiv.innerText = "Generisanje u toku...";

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt: promptText })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Došlo je do greške na serveru.');
                }

                outputDiv.innerText = data.output;
            } catch (err) {
                errorDiv.innerText = "Greška: " + err.message;
                outputDiv.innerText = "";
            }
        }
    </script>

</body>
    </html>
